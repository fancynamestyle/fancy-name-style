<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0b">
<title>Contact Us | FancyNameStyle</title>

<style>
:root{--gold:#d4af37;--gold-light:#f2d675;--bg:#0b0b0b;--panel:#171717;--border:#383024;--text:#e8e5dc;--muted:#aaa398}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:32px 16px;background:radial-gradient(ellipse at top,#211b0b 0%,var(--bg) 55%);color:var(--text);font:16px/1.8 Arial,Helvetica,sans-serif}
main{width:100%;max-width:820px;margin:28px auto}
h1{margin:0 0 24px;text-align:center;color:var(--gold);font-size:clamp(30px,6vw,42px);letter-spacing:.4px}
.box{background:linear-gradient(145deg,#1d1b16,#141414);border:1px solid var(--border);border-radius:16px;padding:clamp(20px,5vw,34px);box-shadow:0 14px 40px #0008}
p{margin:0 0 18px}
a{color:var(--gold-light);text-decoration:none}
a:hover{text-decoration:underline}
.back{display:inline-block;margin-top:10px;color:var(--gold);font-weight:bold}
label{display:block;margin:14px 0 6px;color:var(--gold-light)}
input,textarea{display:block;width:100%;padding:13px 14px;border:1px solid #51452b;border-radius:9px;background:#101010;color:#fff;font:inherit}
input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
button{margin-top:16px;padding:12px 24px;border:0;border-radius:9px;background:var(--gold);color:#111;font-weight:bold;font-size:15px;cursor:pointer}
button:hover{background:var(--gold-light)}
small{color:var(--muted)}
@media(max-width:480px){body{padding:18px 12px}main{margin:12px auto}.box{padding:20px}}
</style>

</head>
<body>
<main>
<h1>Contact Us</h1>
<section class="box">

<p>Have a question, suggestion, or feedback about FancyNameStyle? You can contact us by email.</p>
<p><strong>Email:</strong> <a href="mailto:contact@fancynamestyle.com">contact@fancynamestyle.com</a></p>
<form action="mailto:contact@fancynamestyle.com" method="post" enctype="text/plain">
<label for="name">Your Name</label>
<input id="name" name="Name" type="text" placeholder="Enter your name" required>
<label for="email">Your Email</label>
<input id="email" name="Email" type="email" placeholder="Enter your email" required>
<label for="message">Your Message</label>
<textarea id="message" name="Message" rows="5" placeholder="Write your message..." required></textarea>
<button type="submit">Send Message</button>
</form>
<p><small>Note: This form opens your device's default email app. If it does not work, please email us directly using the address above.</small></p>

<a class="back" href="/">← Back to Home</a>
</section>
</main>
</body>
</html>
